name: Release

# v1.0.0 のようなタグを push すると、ビルド済みのファイルを付けて GitHub の Release を作る。
# すでにあるタグにも使えるよう、Actions の画面から手で動かすこともできる。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release を作るタグ（例: v1.0.0）"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # OS と CPU の種類ごとにビルドする。ファイル名は `uname -m` と `uname -s` の結果に合わせ、
  # README の 1 行（sidels-$(uname -m)-$(uname -s | tr A-Z a-z)）でどの PC でも選べるようにする
  build:
    strategy:
      matrix:
        include:
          # Linux は musl で静的リンクすると、ディストリビューションやバージョン（glibc）を問わず動く。
          # ARM 向けも ARM のマシンで直接ビルドするので、特別な設定が要らない
          - target: x86_64-unknown-linux-musl
            asset: sidels-x86_64-linux
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            asset: sidels-aarch64-linux
            runner: ubuntu-24.04-arm
          # macOS は Apple Silicon のマシンで、Intel 向けも一緒に作れる
          - target: aarch64-apple-darwin
            asset: sidels-arm64-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            asset: sidels-x86_64-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
      ASSET: ${{ matrix.asset }}.tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      # タグと Cargo.toml のバージョンがずれていたら止める（バージョンの上げ忘れを防ぐ）
      - name: Check version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$TAG" ]; then
            echo "Cargo.toml のバージョン v$version とタグ $TAG が一致しません"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
      - run: cargo build --release --locked --target "$TARGET"

      - name: Package
        run: |
          strip "target/$TARGET/release/sidels"
          tar czf "$ASSET" -C "target/$TARGET/release" sidels
          # macOS には sha256sum がないので、どちらにもある shasum を使う
          shasum -a 256 "$ASSET" > "$ASSET.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: sidels-*

  # 全部のビルドが終わってから、Release を 1 回だけ作る（並べて作ると、同時に作ろうとしてぶつかる）
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l sidels-*
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" sidels-* --clobber
          else
            gh release create "$TAG" sidels-* --title "$TAG" --generate-notes
          fi
